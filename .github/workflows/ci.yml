# Intégration continue : à chaque push et à chaque pull request, GitHub lance les trois suites de tests
# et vérifie qu'aucune dépendance n'a de faille connue.
# Chaque lundi, cette vérification est aussi relancée seule : de nouvelles failles sont publiées
# régulièrement, même quand le code ne change pas.
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

# Un nouveau push sur la même branche annule l'exécution précédente, devenue inutile
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'
  # Base MySQL du service ci-dessous. L'utilisateur root peut créer la base de test (catfun_test).
  # Une vraie variable d'environnement passe avant la valeur de backend/.env.
  DATABASE_URL: 'mysql://root:root@127.0.0.1:3306/catfun?serverVersion=8.0'

jobs:
  audit:
    name: Sécurité des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Lit composer.lock et package-lock.json : pas besoin d'installer les paquets.
      # Un paquet abandonné (sans faille connue, ex. doctrine/cache) est signalé sans faire échouer.
      - name: Backend (composer audit)
        working-directory: backend
        run: composer audit --locked --abandoned=report

      - name: Frontend (npm audit)
        working-directory: frontend
        run: npm audit

  backend:
    name: Backend (PHPUnit)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: intl, pdo_mysql, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Vérifier composer.json
        run: composer validate --no-check-publish

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Secrets et clés JWT
        run: sh bin/init-env.sh

      - name: Base de test
        run: |
          php bin/console doctrine:database:create --env=test --no-interaction
          php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Vérifier le schéma de la base
        run: php bin/console doctrine:schema:validate --env=test

      - name: Vérifier les services et la configuration
        run: php bin/console lint:container

      - name: Tests PHPUnit
        run: php bin/phpunit --testdox

  frontend:
    name: Frontend (build + Vitest)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types et construire le site
        run: npm run build

      - name: Tests unitaires (Vitest)
        run: npm test

  e2e:
    name: Bout en bout (Playwright)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: intl, pdo_mysql, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: "Backend : dépendances, secrets et clés JWT"
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          sh bin/init-env.sh

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: "Frontend : dépendances"
        working-directory: frontend
        run: npm ci

      - name: Installer Chromium pour Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Playwright démarre le backend (PHP intégré, APP_ENV=test) et Vite ;
      # e2e/global-setup.ts recrée la base de test à partir des migrations.
      - name: Tests de bout en bout
        working-directory: frontend
        run: npm run test:e2e

      - name: Rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
