services:
  backend:
    build: ./backend
    container_name: catfun-backend
    volumes:
      - ./backend:/var/www/html
      # vendor/ (des milliers de fichiers) et var/ (cache Symfony) restent dans Docker,
      # hors du dossier partagé avec Windows : bien plus rapide. Contrepartie : vendor/
      # n'apparaît plus sur ta machine (il est installé dans le conteneur).
      - backend_vendor:/var/www/html/vendor
      - backend_var:/var/www/html/var
    environment:
      # "db" est le nom du service MySQL ci-dessous, sur le réseau interne de Docker
      DATABASE_URL: "mysql://admin:root@db:3306/catfun?serverVersion=8.0"
      # Emails (mot de passe oublié) envoyés à Mailpit, lisibles sur http://localhost:8025
      MAILER_DSN: "smtp://mailpit:1025"
    depends_on:
      db:
        # Attend que MySQL accepte vraiment les connexions (voir healthcheck)
        condition: service_healthy
      mailpit:
        condition: service_started

  # Tâches planifiées : applique les durées de conservation des données (RGPD) une fois par jour
  # (parties de visiteurs, liens expirés, parties abandonnées, comptes inactifs : voir app:data:purge)
  cron:
    build: ./backend
    container_name: catfun-cron
    # Même utilisateur que PHP-FPM : le cache de Symfony reste accessible aux deux
    user: www-data
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_var:/var/www/html/var
    environment:
      DATABASE_URL: "mysql://admin:root@db:3306/catfun?serverVersion=8.0"
      MAILER_DSN: "smtp://mailpit:1025"
    depends_on:
      - backend
    # Le conteneur backend installe les dépendances et crée .env.local : on attend qu'il ait fini
    entrypoint: ["sh", "-c"]
    command:
      - |
        until [ -f vendor/autoload_runtime.php ] && [ -f .env.local ]; do sleep 5; done
        sleep 30
        while true; do
          php bin/console app:data:purge --no-interaction || echo "Échec du nettoyage, nouvel essai dans 24 h"
          sleep 86400
        done

  frontend:
    build: ./frontend
    container_name: catfun-frontend
    ports:
      - "8081:8080"

  db:
    image: mysql:8.0
    container_name: catfun-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: catfun
      MYSQL_USER: admin
      MYSQL_PASSWORD: root
    ports:
      # Port 3307 sur ta machine (3306 est souvent déjà pris par un MySQL installé localement).
      # Accessible uniquement depuis ta machine, pas depuis le réseau.
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # Ping en TCP : pendant sa première initialisation, MySQL n'écoute pas encore le réseau
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Boîte mail de test : attrape tous les emails envoyés par le site (rien ne part vraiment)
  mailpit:
    image: axllent/mailpit:latest
    container_name: catfun-mailpit
    ports:
      - "127.0.0.1:8025:8025"

  nginx:
    image: nginx:latest
    container_name: catfun-nginx
    ports:
      - "8082:80"
    volumes:
      - ./backend:/var/www/html
      - ./nginx/conf:/etc/nginx/conf.d
    depends_on:
      - backend

volumes:
  db_data:
  backend_vendor:
  backend_var:
