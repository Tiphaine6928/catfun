; Réglages PHP du conteneur backend (développement).
;
; Sous Windows/WSL, le code est partagé avec Docker par un montage lent : sans cache,
; chaque requête relit des centaines de fichiers PHP à travers ce montage (plusieurs
; secondes par requête). OPcache garde le code compilé en mémoire.

opcache.enable=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.interned_strings_buffer=16
; Développement : les fichiers modifiés sont repris, avec au plus 2 s de délai
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; Mémorise l'emplacement des fichiers déjà trouvés (moins d'accès au montage)
realpath_cache_size=4096K
realpath_cache_ttl=600
