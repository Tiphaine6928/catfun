# Messages d'erreur de connexion, plus clairs que ceux fournis par Symfony
# (mêmes textes que la page de connexion du frontend).
# Les autres messages de sécurité gardent la traduction française de Symfony.
'Invalid credentials.': 'Email ou mot de passe incorrect.'
'Bad credentials.': 'Email ou mot de passe incorrect.'
'Invalid CSRF token.': 'La page a expiré, recharge-la et réessaie.'
# Trop de tentatives de connexion (login_throttling)
'Too many failed login attempts, please try again in %minutes% minute.': 'Trop de tentatives de connexion. Réessaie dans %minutes% minute.'
'Too many failed login attempts, please try again in %minutes% minutes.': 'Trop de tentatives de connexion. Réessaie dans %minutes% minutes.'
'Too many failed login attempts, please try again later.': 'Trop de tentatives de connexion. Réessaie plus tard.'
