security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                provider: app_user_provider
                success_handler: lexik_jwt_authentication.handler.authentication_success
                # 429 avec un message clair quand il y a trop de tentatives (voir LoginFailureHandler)
                failure_handler: App\Security\LoginFailureHandler
            # Limite les tentatives de connexion : par défaut 5 par quart d'heure pour un même email
            # depuis une même adresse IP, et 25 par quart d'heure par adresse IP (config/packages/rate_limiter.yaml).
            # Seuls les échecs comptent ; ils expirent au bout du quart d'heure.
            login_throttling:
                limiter: app.login_rate_limiter
        
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register$, roles: PUBLIC_ACCESS, methods: [POST] }
        # Liste des jeux et classements consultables sans être connecté
        - { path: ^/api/games$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/games/\d+/leaderboard$, roles: PUBLIC_ACCESS, methods: [GET] }
        # Les jeux se jouent aussi sans compte (un token, s'il est envoyé, est quand même vérifié).
        # Enregistrer le score d'une partie de visiteur (/claim) demande d'être connecté.
        - { path: ^/api/games/\d+/sessions$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: '^/api/sessions/[0-9a-f]{32}$', roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: '^/api/sessions/[0-9a-f]{32}/(guess|flip)$', roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
