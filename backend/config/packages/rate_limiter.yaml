# Limites de tentatives. Les seuils se règlent par variables d'environnement (valeurs par défaut dans .env).
framework:
    rate_limiter:
        # Inscription : par adresse IP. Les tentatives refusées comptent aussi : elles permettraient
        # sinon de tester en masse quels emails ont déjà un compte.
        registration:
            policy: sliding_window
            limit: '%env(int:REGISTRATION_MAX_ATTEMPTS)%'
            interval: '1 hour'

        # Connexion (utilisées par login_throttling, voir security.yaml) :
        # par compte et adresse IP…
        login_per_account:
            policy: fixed_window
            limit: '%env(int:LOGIN_MAX_ATTEMPTS_PER_ACCOUNT)%'
            interval: '15 minutes'
        # … et par adresse IP, tous comptes confondus (un robot qui essaie beaucoup d'emails)
        login_per_ip:
            policy: fixed_window
            limit: '%env(int:LOGIN_MAX_ATTEMPTS_PER_IP)%'
            interval: '15 minutes'

        # Parties lancées sans être connecté : par adresse IP (évite qu'un robot remplisse la base)
        guest_games:
            policy: sliding_window
            limit: '%env(int:GUEST_GAMES_MAX_PER_HOUR)%'
            interval: '1 hour'

        # « Mot de passe oublié » : demandes par adresse IP…
        password_reset:
            policy: sliding_window
            limit: '%env(int:PASSWORD_RESET_MAX_PER_HOUR)%'
            interval: '1 hour'
        # … et emails envoyés par compte (personne ne peut remplir la boîte d'un autre)
        password_reset_per_email:
            policy: sliding_window
            limit: 3
            interval: '1 hour'

        # Suppression du compte : essais de mot de passe par compte
        account_deletion:
            policy: fixed_window
            limit: 5
            interval: '15 minutes'

        # Changement d'email : demandes (et mots de passe essayés) par compte
        email_change:
            policy: fixed_window
            limit: 5
            interval: '1 hour'
